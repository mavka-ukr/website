    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --bg-sidebar: #0d1117;
        --bg-titlebar: #0d1117;
        --bg-hover: #6e76811a;
        --bg-selected: #6e768166;
        --border: #30363d;
        --accent: #1f6feb;
        --text: #e6edf3;
        --text-muted: #8b949e;
        --text-heading: #8b949e;
        --folder-color: #d29922;
        --file-color: #79c0ff;
        --tree-text: #c9d1d9;
        --sidebar-width: 260px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        display: flex;
        flex-direction: column;
      }

      /* ─── Рядок заголовку ───────────────────────────────── */
      .TitleBar {
        height: 35px;
        flex-shrink: 0;
        background: var(--bg-titlebar);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        user-select: none;
        border-bottom: 1px solid var(--border);
      }

      .TitleBar-label {
        font-size: 12px;
        color: var(--text-muted);
        pointer-events: none;
        max-width: calc(100% - 80px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .TitleBar-toggle {
        position: absolute;
        left: 8px;
        display: none;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        background: none;
        border: none;
        border-radius: 3px;
        color: var(--text-muted);
        cursor: pointer;
        padding: 0;
      }
      .TitleBar-toggle:hover {
        background: var(--bg-hover);
        color: var(--text);
      }

      .TitleBar-actions {
        position: absolute;
        left: 8px;
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .TitleBar-action {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        background: none;
        border: none;
        border-radius: 3px;
        color: var(--text-muted);
        cursor: pointer;
        padding: 0;
        text-decoration: none;
      }
      .TitleBar-action:hover {
        background: var(--bg-hover);
        color: var(--text);
      }
      .TitleBar-action[hidden] {
        display: none;
      }

      /* ─── Робоча область ─────────────────────────────────── */
      .Workbench {
        flex: 1;
        display: flex;
        min-height: 0;
        overflow: hidden;
      }

      /* ─── Бічна панель ─────────────────────────────────── */
      .Sidebar {
        width: var(--sidebar-width);
        flex-shrink: 0;
        background: var(--bg-sidebar);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .Sidebar-head {
        height: 35px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        padding: 0 14px;
      }

      .Sidebar-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--text-heading);
      }

      /* ─── Дерево ─────────────────────────────────────────── */
      .Tree {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 2px 0 8px;
      }
      .Tree::-webkit-scrollbar {
        width: 8px;
      }
      .Tree::-webkit-scrollbar-track {
        background: transparent;
      }
      .Tree::-webkit-scrollbar-thumb {
        background: rgba(121, 121, 121, 0.35);
        border-radius: 4px;
      }
      .Tree::-webkit-scrollbar-thumb:hover {
        background: rgba(121, 121, 121, 0.6);
      }

      .TreeList {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .TreeItem {
        list-style: none;
      }

      .TreeRow {
        display: flex;
        align-items: center;
        height: 22px;
        padding-right: 8px;
        gap: 2px;
        cursor: pointer;
        user-select: none;
        color: var(--tree-text);
        background: none;
        border: none;
        width: 100%;
        text-align: left;
        outline: none;
        overflow: hidden;
        white-space: nowrap;
      }
      .TreeRow:hover {
        background: var(--bg-hover);
      }
      .TreeRow.is-selected {
        background: var(--bg-selected);
      }
      .TreeRow:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: -1px;
      }

      .TreeRow-chevron {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        transition: transform 0.12s ease;
      }
      .TreeRow[aria-expanded="true"] .TreeRow-chevron {
        transform: rotate(90deg);
      }

      .TreeRow-spacer {
        flex-shrink: 0;
        width: 16px;
      }

      .TreeRow-icon {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .TreeRow-icon svg {
        width: 16px;
        height: 16px;
        display: block;
      }

      .TreeRow-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        line-height: 1;
      }

      .TreeChildren {
        list-style: none;
      }
      .TreeChildren[hidden] {
        display: none;
      }

      /* ─── Редактор ───────────────────────────────────────── */
      .Editor {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        overflow: hidden;
      }

      .Welcome {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: var(--text-muted);
        pointer-events: none;
      }
      .Welcome-icon {
        opacity: 0.12;
      }
      .Welcome-hint {
        font-size: 14px;
      }
      .Welcome.is-hidden {
        display: none;
      }

      .EditorFrame {
        flex: 1;
        min-height: 0;
        border: none;
        width: 100%;
        height: 100%;
        background: var(--bg);
        display: none;
        color-scheme: dark;
      }
      .EditorFrame.is-visible {
        display: block;
      }

      /* ─── Мобільне накладення ──────────────────────────── */
      .Overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.48);
        z-index: 50;
      }

      /* ─── Адаптивність ──────────────────────────────────── */
      @media (max-width: 680px) {
        .TitleBar-toggle {
          display: flex;
        }

        .TitleBar-actions {
          left: auto;
          right: 8px;
        }

        .Sidebar {
          position: fixed;
          top: 35px;
          bottom: 22px;
          left: 0;
          z-index: 100;
          transform: translateX(-100%);
          transition: transform 0.2s ease;
          box-shadow: 4px 0 20px rgba(0, 0, 0, 0.5);
          border-right-color: rgba(255, 255, 255, 0.08);
        }
        .Sidebar.is-open {
          transform: translateX(0);
        }

        .Overlay.is-visible {
          display: block;
        }
      }
    </style>

          children.className = "TreeChildren";
          children.hidden = true;

          for (const child of sortNodes(node.children || [])) {
            children.append(buildItem(child, depth + 1, [...ancestors, row]));
          }

          const toggle = () => {
            const open = row.getAttribute("aria-expanded") === "true";
            row.setAttribute("aria-expanded", open ? "false" : "true");
            children.hidden = open;
          };
          row.addEventListener("click", toggle);
          row.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });

          li.append(row, children);
        } else {
          row.setAttribute("role", "treeitem");

          const spacer = document.createElement("span");
          spacer.className = "TreeRow-spacer";

          const icon = makeIconEl(node);
          icon.className = "TreeRow-icon";

          const label = document.createElement("span");
          label.className = "TreeRow-label";
          label.textContent = node.name;

          row.append(spacer, icon, label);

          fileIndex.set(node.path, { node, rowEl: row, ancestors });
          row.addEventListener("click", () => navigate(node.path));
          row.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); navigate(node.path); } });

          li.append(row);
        }

        return li;
      }

      function navigate(path) {
        const entry = fileIndex.get(path);
        if (!entry) return;

        // Розгорнути батьківські вузли
        for (const anc of entry.ancestors) {
          if (anc.getAttribute("aria-expanded") === "false") {
            anc.setAttribute("aria-expanded", "true");
            anc.nextElementSibling.hidden = false;
          }
        }

        // Виділити рядок
        if (activeRow) activeRow.classList.remove("is-selected");
        activeRow = entry.rowEl;
        activeRow.classList.add("is-selected");
        activeRow.scrollIntoView({ block: "nearest" });

        // Завантажити iframe
        elFrame.src = path + ".html";
        elFrame.classList.add("is-visible");
        elWelcome.classList.add("is-hidden");

        // Оновити заголовок
        document.title = path;
        elTitleLabel.textContent = path;

        // Оновити хеш URL
        const encoded = encodeURIComponent(path);
        if (location.hash !== `#${encoded}`) {
          history.replaceState(null, "", `#${encoded}`);
        }

        // Закрити мобільну бічну панель
        if (window.innerWidth <= 680) {
          elSidebar.classList.remove("is-open");
          elOverlay.classList.remove("is-visible");
        }
      }

      // Мобільна бічна панель
      elToggle.addEventListener("click", () => {
        elSidebar.classList.toggle("is-open");
        elOverlay.classList.toggle("is-visible");
      });
      elOverlay.addEventListener("click", () => {
        elSidebar.classList.remove("is-open");
        elOverlay.classList.remove("is-visible");
      });

      // Показати/сховати кнопки дій
      const DOWNLOAD     = "https://github.com/mavka-ukr/files/raw/main/%D0%B2%D0%B8%D0%BF%D1%83%D1%81%D0%BA%D0%B8-%D0%BC%D0%B0%D0%B2%D0%BA%D0%B8/0.124.15/%D0%BC%D0%B0%D0%B2%D0%BA%D0%B0-0.124.15.tar.xz";
      const GITHUB       = "https://github.com/mavka-ukr/mavka";
      const VERSIONS_URL = "../index.html";
      const elGithubBtn   = document.getElementById("githubBtn");
      const elDownloadBtn = document.getElementById("downloadBtn");
      const elVersionsBtn = document.getElementById("versionsBtn");
      if (!GITHUB)       elGithubBtn.hidden   = true;
      if (!DOWNLOAD)     elDownloadBtn.hidden = true;
      if (!VERSIONS_URL) elVersionsBtn.hidden = true;

      // Побудувати дерево
      elTree.append(buildList(TREE.children || [], 0, []));

      // Відновити з хешу
      function openFromHash() {
        const hash = location.hash.slice(1);
        if (!hash) return;
        const path = decodeURIComponent(hash);
        if (fileIndex.has(path)) navigate(path);
      }

      openFromHash();
      window.addEventListener("hashchange", openFromHash);
    </script>
  </body>
</html>
